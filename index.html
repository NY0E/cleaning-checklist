<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1c1b19">
<title>BaseKC Housekeeping</title>
</head>
<body style="margin:0; background:#1c1b19;">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#1c1b19;
    --paper:#f6f1e7;
    --paper-dim:#ece4d4;
    --rust:#a8462b;
    --rust-dark:#7e331f;
    --pine:#3c5b45;
    --pine-dark:#2b4232;
    --gold:#c69a3f;
    --line: rgba(28,27,25,0.14);
    --shadow: 0 2px 10px rgba(28,27,25,0.10);
  }

  * { box-sizing: border-box; }

  .bkc-root{
    font-family: 'Inter', sans-serif;
    background: var(--ink);
    color: var(--paper);
    min-height: 100%;
    padding: 0 0 40px 0;
  }

  .bkc-header{
    padding: 22px 18px 16px;
    border-bottom: 1px solid rgba(246,241,231,0.12);
    background: var(--ink);
  }

  .bkc-brand{
    display:flex;
    align-items:baseline;
    gap: 8px;
    margin-bottom: 14px;
  }
  .bkc-brand .mark{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size: 15px;
    letter-spacing: 0.14em;
    color: var(--gold);
  }
  .bkc-brand .sub{
    font-size: 12px;
    color: rgba(246,241,231,0.55);
    font-weight: 500;
  }

  .bkc-title{
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.01em;
    margin: 0 0 14px 0;
  }

  .bkc-selectors{
    display:flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .bkc-home-btn{
    width: 34px; height: 34px;
    border-radius: 100px;
    border: 1px solid rgba(246,241,231,0.25);
    background: transparent;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .bkc-home-panel{
    display:none;
    margin-top: 10px;
    padding: 12px 14px;
    background: rgba(246,241,231,0.08);
    border: 1px solid rgba(246,241,231,0.18);
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
  }
  .bkc-home-panel.show{ display:block; }
  .bkc-home-panel b{ color: var(--gold); }
  .bkc-home-panel p{ margin: 6px 0; }
  .bkc-panel-close-row{
    display:flex;
    justify-content: flex-end;
  }
  .bkc-panel-close{
    background: transparent;
    border: none;
    color: rgba(246,241,231,0.6);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .bkc-panel-close:hover{ background: rgba(246,241,231,0.12); }
  .bkc-pill{
    font-family:'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 100px;
    border: 1px solid rgba(246,241,231,0.25);
    background: transparent;
    color: var(--paper);
    cursor:pointer;
    transition: all .15s ease;
  }
  .bkc-pill.active{
    background: var(--rust);
    border-color: var(--rust);
    color: #fff;
  }
  .bkc-pill:active{ transform: scale(0.96); }

  .bkc-progress-wrap{
    padding: 14px 18px;
    display:flex;
    align-items:center;
    gap: 14px;
    position: sticky;
    top: 0;
    background: var(--ink);
    border-bottom: 1px solid rgba(246,241,231,0.12);
    z-index: 20;
  }
  .bkc-stamp{
    flex-shrink:0;
    width: 56px; height:56px;
    border-radius:50%;
    border: 3px solid var(--pine);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size: 15px;
    color: var(--pine);
    background: rgba(60,91,69,0.12);
    position:relative;
    transition: all .2s ease;
  }
  .bkc-stamp.done{
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(198,154,63,0.15);
    transform: rotate(-6deg) scale(1.05);
  }
  .bkc-progress-track{
    flex:1;
    height: 8px;
    background: rgba(246,241,231,0.12);
    border-radius: 100px;
    overflow:hidden;
  }
  .bkc-progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--rust), var(--gold));
    border-radius:100px;
    transition: width .3s ease;
  }
  .bkc-progress-label{
    font-size: 12px;
    color: rgba(246,241,231,0.6);
    margin-top: 6px;
  }

  .bkc-flags{
    margin: 10px 18px 0;
    padding: 10px 14px;
    background: rgba(168,70,43,0.18);
    border: 1px solid rgba(168,70,43,0.4);
    border-radius: 10px;
    font-size: 13px;
    display:none;
  }
  .bkc-flags.show{ display:block; }
  .bkc-flags b{ color: var(--gold); }

  .bkc-pest-banner{
    display:none;
    margin: 10px 18px 0;
    padding: 10px 14px;
    background: rgba(184,134,11,0.18);
    border: 1px solid rgba(184,134,11,0.45);
    border-radius: 10px;
    font-size: 13px;
  }
  .bkc-pest-banner.show{ display:block; }
  .bkc-pest-banner b{ color: #b8860b; }

  .bkc-notes-wrap{
    margin: 14px 18px 0;
  }
  .bkc-notes-label{
    display:block;
    font-size: 12px;
    font-weight:600;
    color: rgba(246,241,231,0.55);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .bkc-notes-input{
    width: 100%;
    font-family:'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(246,241,231,0.2);
    background: rgba(246,241,231,0.06);
    color: var(--paper);
    resize: vertical;
  }
  .bkc-notes-input::placeholder{
    color: rgba(246,241,231,0.35);
  }

  .bkc-identity-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 12.5px;
    color: rgba(246,241,231,0.7);
  }
  .bkc-logout-link{
    background: none;
    border: none;
    color: var(--gold);
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  .bkc-login-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: var(--ink);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .bkc-login-overlay.show{ display: flex; }
  .bkc-login-box{
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    padding: 24px 20px;
    max-width: 320px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .bkc-login-brand{
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.14em;
    color: var(--rust);
    margin-bottom: 6px;
  }
  .bkc-login-title{
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 14px;
  }
  .bkc-login-input{
    width: 100%;
    font-family:'Inter', sans-serif;
    font-size: 15px;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fffdf9;
    color: var(--ink);
  }

  .bkc-body{
    padding: 18px 14px 0;
  }

  .bkc-section{
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    overflow:hidden;
  }
  .bkc-section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .bkc-section-title{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size: 15px;
    letter-spacing:0.01em;
  }
  .bkc-section-count{
    font-size: 12px;
    color: rgba(28,27,25,0.5);
    font-weight:600;
  }
  .bkc-section-subtitle{
    font-size: 12px;
    font-weight: 600;
    color: var(--rust);
    margin-top: 2px;
  }
  .bkc-chevron{
    width: 18px; height:18px;
    transition: transform .2s ease;
    opacity:0.5;
  }
  .bkc-section.collapsed .bkc-chevron{ transform: rotate(-90deg); }
  .bkc-section.collapsed .bkc-items{ display:none; }

  .bkc-items{
    border-top: 1px solid var(--line);
  }

  .bkc-item.critical{
    background: rgba(168,70,43,0.06);
    border-left: 3px solid var(--rust);
    padding-left: 13px;
  }
  .bkc-critical-tag{
    display: inline-block;
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #fff;
    background: var(--rust);
    padding: 2px 6px;
    border-radius: 4px;
    vertical-align: middle;
    margin-right: 2px;
  }

  .bkc-item{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
  }
  .bkc-item:last-child{ border-bottom:none; }

  .bkc-check{
    width: 24px; height: 24px;
    border-radius: 7px;
    border: 2px solid rgba(28,27,25,0.3);
    flex-shrink:0;
    margin-top: 1px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #fff;
    transition: all .15s ease;
  }
  .bkc-check.checked{
    background: var(--pine);
    border-color: var(--pine);
  }
  .bkc-check svg{ width:14px; height:14px; opacity:0; transition: opacity .1s ease; }
  .bkc-check.checked svg{ opacity:1; }

  .bkc-item-text{
    flex:1;
    font-size: 14.5px;
    line-height:1.4;
    padding-top: 2px;
    transition: all .15s ease;
  }
  .bkc-item.done .bkc-item-text{
    text-decoration: line-through;
    color: rgba(28,27,25,0.4);
  }
  .bkc-item-note{
    font-size: 12px;
    color: var(--rust-dark);
    margin-top: 4px;
    font-style: italic;
  }

  .bkc-flag-btn{
    flex-shrink:0;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: rgba(28,27,25,0.35);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .bkc-flag-btn.flagged{ color: var(--rust); }
  .bkc-flag-btn svg{ width:17px; height:17px; }

  .bkc-note-input{
    display:none;
    width: 100%;
    margin-top: 8px;
    padding: 8px 10px;
    font-family:'Inter', sans-serif;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fffdf9;
    color: var(--ink);
    resize:vertical;
  }
  .bkc-note-input.show{ display:block; }

  .bkc-camera-btn{
    display:flex;
    align-items:center;
    gap: 6px;
    font-family:'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 11px;
    border-radius: 8px;
    border: 1px solid var(--pine);
    background: rgba(60,91,69,0.08);
    color: var(--pine-dark);
    cursor:pointer;
  }
  .bkc-camera-btn svg{ width:15px; height:15px; }
  .bkc-camera-btn:active{ transform: scale(0.97); }

  .bkc-owner-note{
    font-size: 12.5px;
    color: var(--rust-dark);
    background: rgba(198,154,63,0.16);
    border-left: 3px solid var(--gold);
    padding: 6px 9px;
    border-radius: 6px;
    margin-top: 6px;
    line-height: 1.4;
  }
  .bkc-owner-note b{ color: var(--rust-dark); }

  .bkc-owner-note-input{
    width: 100%;
    margin-top: 6px;
    padding: 8px 10px;
    font-family:'Inter', sans-serif;
    font-size: 13px;
    border: 1px solid var(--gold);
    border-radius: 8px;
    background: #fffdf6;
    color: var(--ink);
    resize: vertical;
  }

  .bkc-ref-btn{
    display:flex;
    align-items:center;
    gap: 6px;
    font-family:'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(28,27,25,0.2);
    background: transparent;
    color: rgba(28,27,25,0.55);
    cursor:pointer;
  }
  .bkc-ref-btn svg{ width:14px; height:14px; }
  .bkc-ref-placeholder{
    margin-top: 6px;
    padding: 14px 10px;
    border: 1px dashed rgba(28,27,25,0.3);
    border-radius: 8px;
    font-size: 12px;
    color: rgba(28,27,25,0.45);
    text-align: center;
    font-style: italic;
  }

  .bkc-pest-btn.pest-active{
    color: #b8860b;
    background: rgba(184,134,11,0.14);
  }
  .bkc-pest-wrap{
    margin: 0 16px 12px;
    padding: 10px;
    background: rgba(184,134,11,0.08);
    border: 1px solid rgba(184,134,11,0.35);
    border-radius: 8px;
  }
  .bkc-pest-label{
    font-size: 12.5px;
    font-weight: 700;
    color: #8a6508;
    margin-bottom: 6px;
  }
  .bkc-pest-note-input{
    width: 100%;
    font-family:'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid rgba(184,134,11,0.4);
    border-radius: 8px;
    background: #fffdf6;
    color: var(--ink);
    resize: vertical;
  }

  .bkc-comment-btn.comment-active{
    color: var(--rust);
    background: rgba(168,70,43,0.14);
  }
  .bkc-comment-btn.note-pending{
    color: var(--gold);
    background: rgba(198,154,63,0.16);
  }
  .bkc-thread{
    margin-top: 8px;
    padding: 10px;
    background: rgba(198,154,63,0.08);
    border: 1px solid rgba(198,154,63,0.35);
    border-radius: 8px;
  }
  .bkc-thread-msg{
    font-size: 12.5px;
    padding: 6px 9px;
    border-radius: 6px;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  .bkc-thread-msg-steve{
    background: rgba(198,154,63,0.18);
    border-left: 3px solid var(--gold);
    color: var(--rust-dark);
  }
  .bkc-thread-msg-steve b{ color: var(--rust-dark); }
  .bkc-thread-edit-link{
    display: block;
    background: none;
    border: none;
    color: var(--pine);
    font-size: 11.5px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0 0 8px;
  }
  .bkc-thread-reply-label{
    font-size: 12px;
    font-weight: 600;
    color: rgba(28,27,25,0.55);
    margin-bottom: 4px;
  }
  .bkc-thread-close{
    margin-top: 8px;
    font-family:'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    background: var(--pine);
    color: #fff;
    cursor: pointer;
  }

  .bkc-floor-divider{
    font-family:'Oswald', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    padding: 16px 4px 8px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .bkc-floor-divider::after{
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(246,241,231,0.15);
  }

  .bkc-footer{
    padding: 20px 18px 4px;
    display:flex;
    gap: 10px;
  }
  .bkc-btn{
    flex:1;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 14px;
    padding: 13px;
    border-radius: 10px;
    border: none;
    cursor:pointer;
  }
  .bkc-btn.primary{
    background: var(--pine);
    color: #fff;
  }
  .bkc-btn.ghost{
    background: transparent;
    border: 1px solid rgba(246,241,231,0.3);
    color: var(--paper);
  }

  .bkc-meta{
    text-align:center;
    font-size: 11px;
    color: rgba(246,241,231,0.35);
    padding: 14px 18px 0;
  }

  .bkc-btn.submit{
    background: var(--rust);
    color: #fff;
    position: relative;
  }
  .bkc-submit-row{
    padding: 0 18px;
    margin-top: 10px;
  }
  .bkc-demo-tag{
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.25);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
  }
  .bkc-toast{
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--pine-dark);
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    opacity: 0;
    pointer-events: none;
    transition: all .25s ease;
    z-index: 100;
    max-width: 85%;
    text-align: center;
  }
  .bkc-toast.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .bkc-loading{
    padding: 40px 18px;
    text-align:center;
    color: rgba(246,241,231,0.5);
    font-size: 14px;
  }

  .bkc-modal-overlay{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .bkc-modal-overlay.show{
    display: flex;
  }
  .bkc-modal{
    background: var(--paper);
    color: var(--ink);
    border-radius: 14px;
    padding: 20px;
    max-width: 320px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .bkc-modal-title{
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .bkc-modal-input{
    width: 100%;
    font-family:'Inter', sans-serif;
    font-size: 18px;
    letter-spacing: 0.2em;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fffdf9;
    color: var(--ink);
  }
  .bkc-modal-error{
    color: var(--rust);
    font-size: 12.5px;
    font-weight: 600;
    min-height: 18px;
    margin-top: 6px;
  }
  .bkc-modal-btn-row{
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .bkc-modal-btn-row .bkc-btn.ghost{
    border: 1px solid rgba(28,27,25,0.25);
    color: var(--ink);
  }

  .bkc-archive-entry{
    padding: 10px;
    margin-bottom: 8px;
    background: rgba(246,241,231,0.06);
    border: 1px solid rgba(246,241,231,0.15);
    border-radius: 8px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .bkc-archive-entry b{ color: var(--gold); }
  .bkc-archive-detail{
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(246,241,231,0.15);
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .bkc-archive-photo-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    gap: 6px;
    margin-top: 10px;
  }
  .bkc-archive-photo-thumb{
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid rgba(246,241,231,0.2);
  }
</style>

<div class="bkc-root" id="bkcRoot">
  <div class="bkc-login-overlay" id="bkcLoginOverlay">
    <div class="bkc-login-box">
      <div class="bkc-login-brand">BASEKC</div>
      <div class="bkc-login-title" id="bkcLoginTitle">Sign in to continue</div>
      <input class="bkc-login-input" id="bkcLoginName" type="text" placeholder="Your name" autocomplete="off" />
      <input class="bkc-login-input" id="bkcLoginPin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="margin-top:8px;" />
      <div class="bkc-modal-error" id="bkcLoginErrorMsg"></div>
      <button class="bkc-btn primary" id="bkcLoginSubmit" style="width:100%; margin-top:10px;">Sign In</button>
    </div>
  </div>

  <div class="bkc-header">
    <div class="bkc-brand">
      <span class="mark">BASEKC</span>

  function buildArchiveRecord(){
    const flaggedEntries = [];
    const sections = state.type === 'deep-clean' ? deepCleanSectionsFor(state.unit) : sectionsFor(state.unit);
    let totalItems = 0, doneItems = 0;
    sections.forEach(sec => {
      if (sec.divider) return;
      sec.items.forEach((text, idx) => {
        const k = itemKey(sec.key, idx);
        const entry = state.checklist[k];
        totalItems++;
        if (entry && entry.done) doneItems++;
        if (entry && entry.comment && entry.comment.trim()) {
          flaggedEntries.push({ section: sec.title, item: text, comment: entry.comment, done: !!(entry && entry.done) });
        }
      });
    });
    const pestEntries = Object.entries(state.sectionPest)
      .filter(([, v]) => v && v.active)
      .map(([sectionKey, v]) => ({ sectionKey, note: v.note || '' }));

    return {
      unit: state.unit,
      type: state.type,
      sessionDate: state.sessionDate,
      archivedAt: new Date().toISOString(),
      cleanerName: state.cleanerName || '(not entered)',
      totalItems,
      doneItems,
      generalNotes: state.generalNotes,
      commentedItems: flaggedEntries,
      pestReports: pestEntries,
      photos: state.photos, // { itemKey: publicPhotoUrl } — real, permanent Storage URLs
    };
  }

  async function saveArchive(record){
    const { error } = await sb.from('archives').insert({
      unit: record.unit,
      type: record.type,
      session_date: record.sessionDate,
      archived_at: record.archivedAt,
      cleaner_name: record.cleanerName,
      total_items: record.totalItems,
      done_items: record.doneItems,
      general_notes: record.generalNotes,
      commented_items: record.commentedItems,
      pest_reports: record.pestReports,
      photos: record.photos,
    });
    if (error) throw error;
  }

  async function loadArchiveList(){
    try{
      const { data, error } = await sb.from('archives')
        .select('id, archived_at, session_date, cleaner_name, total_items, done_items, commented_items, pest_reports')
        .eq('unit', state.unit).eq('type', state.type)

  // Resize/compress a captured photo client-side before uploading to Supabase Storage —
  // keeps uploads fast and cheap. Target: long edge 900px, JPEG quality 0.7.
  function compressPhotoToBlob(file){
    return new Promise((resolve, reject) => {
      const img = new Image();

      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        const maxDim = 900;
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob); else reject(new Error('canvas toBlob failed'));
        }, 'image/jpeg', 0.7);
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Uploads a compressed photo to the checklist-photos bucket and returns its public URL.
  // pathPrefix identifies what the photo is of (e.g. 'A/turnover/bath1::1' or 'A/turnover/pest::bath1');
  // a timestamp is appended so retakes don't overwrite/collide with the previous file.
  async function uploadPhoto(file, pathPrefix){
    const blob = await compressPhotoToBlob(file);
    const path = `${pathPrefix}-${Date.now()}.jpg`;
    const { error } = await sb.storage.from('checklist-photos').upload(path, blob, {
      contentType: 'image/jpeg',
      upsert: true,
    });
    if (error) throw error;
    const { data } = sb.storage.from('checklist-photos').getPublicUrl(path);
    return data.publicUrl;
  }

    const pestBanner = document.getElementById('bkcPestBanner');
    if (pestAlerts.length) {
      pestBanner.className = 'bkc-pest-banner show';
      const pestBannerLabel = uiText('pestBannerLabel', pestAlerts.length)
        || `🐛 ${pestAlerts.length} pest report${pestAlerts.length > 1 ? 's' : ''} for Steve:`;
      pestBanner.innerHTML = `<b>${pestBannerLabel}</b><br>` + pestAlerts.map(f => `• ${f}`).join('<br>');
    } else {
      pestBanner.className = 'bkc-pest-banner';
      pestBanner.innerHTML = '';
    }

    document.getElementById('bkcMeta').textContent = uiText('meta', state.sessionDate, nextDeepCleanLabel())
      || `Session: ${state.sessionDate} · Next deep clean due: ${nextDeepCleanLabel()} · Shared checklist — visible to anyone with this link`;

    document.getElementById('bkcNotesLabel').textContent = uiText('notesForSteve') || 'Notes for Steve';
    const notesInput = document.getElementById('bkcNotesInput');
    notesInput.placeholder = uiText('notesPlaceholder') || 'Anything else worth mentioning — leave it here.';
    if (notesInput.value !== state.generalNotes) {
      notesInput.value = state.generalNotes;
    }

    const identityLabel = uiText('signedInAs') || 'Signed in as';
    document.getElementById('bkcIdentityLabel').textContent = `${identityLabel} ${state.cleanerName || '—'}`;
    document.getElementById('bkcLogoutBtn').textContent = uiText('signOut') || 'Sign out';

    document.getElementById('bkcSubmitBtn').textContent = uiText('completeArchive') || 'Complete & Archive Turnover';
  }

  document.getElementById('bkcNotesInput').addEventListener('input', (e) => {
    state.generalNotes = e.target.value;
    saveState();
  });

  document.getElementById('bkcLogoutBtn').addEventListener('click', () => {
    localStorage.removeItem('bkc-cleaner-auth');
    location.reload();
  });

  document.getElementById('bkcSubmitBtn').addEventListener('click', () => {
    state.showPasscodeModal = true;
    state.passcodeInput = '';
    state.passcodeError = false;
    renderPasscodeModal();
  });

  function renderPasscodeModal(){
    const overlay = document.getElementById('bkcPasscodeOverlay');
    overlay.className = 'bkc-modal-overlay' + (state.showPasscodeModal ? ' show' : '');
    document.getElementById('bkcPasscodeTitle').textContent = uiText('passcodeTitle') || 'Enter passcode to complete this turnover';
    const input = document.getElementById('bkcPasscodeInput');
    input.value = state.passcodeInput;
    document.getElementById('bkcPasscodeErrorMsg').textContent = state.passcodeError
      ? (uiText('passcodeWrong') || 'Incorrect passcode — try again.')
      : '';
    document.getElementById('bkcPasscodeCancel').textContent = uiText('cancelBtn') || 'Cancel';
    document.getElementById('bkcPasscodeConfirm').textContent = uiText('confirmBtn') || 'Confirm';
    if (state.showPasscodeModal) setTimeout(() => input.focus(), 0);
  }

  document.getElementById('bkcPasscodeInput').addEventListener('input', (e) => {
    state.passcodeInput = e.target.value;
  });
  document.getElementById('bkcPasscodeInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('bkcPasscodeConfirm').click();
  });

  document.getElementById('bkcPasscodeCancel').addEventListener('click', () => {
    state.showPasscodeModal = false;
    renderPasscodeModal();
  });

  document.getElementById('bkcPasscodeConfirm').addEventListener('click', async () => {
    if (state.passcodeInput !== PASSCODE) {
      state.passcodeError = true;
      state.passcodeInput = '';
      renderPasscodeModal();
      return;
    }
    state.showPasscodeModal = false;
    renderPasscodeModal();

    const record = buildArchiveRecord();
    try{
      await saveArchive(record);
    } catch(e){
      console.error('archive save failed', e);
    }

    // reset the live session — owner notes (standing instructions) and the signed-in
    // cleaner identity both carry forward; everything else about THIS turnover resets
    state.sessionDate = today();
    state.checklist = {};
    state.collapsedSections = {};
    state.generalNotes = '';
    state.photos = {};
    state.sectionPest = {};
    saveState();

    const toast = document.getElementById('bkcToast');
    const when = new Date(record.archivedAt).toLocaleString(state.language === 'es' ? 'es' : 'en-US');
    toast.textContent = uiText('archivedToast', when) || `Turnover archived (${when}). Fresh checklist ready for the next cleaning.`;
    toast.classList.add('show');
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 4500);

    render();
  });

  document.getElementById('bkcHomeBtn').addEventListener('click', () => {
    state.showAddToHome = !state.showAddToHome;
    renderHomePanel();
  });

  document.getElementById('bkcHelpBtn').addEventListener('click', () => {
    state.showHelp = !state.showHelp;
    renderHelpPanel();
  });

  document.getElementById('bkcArchiveBtn').addEventListener('click', async () => {
    state.showArchivePanel = !state.showArchivePanel;
    if (state.showArchivePanel) await loadArchiveList();
    renderArchivePanel();
  });

  function renderArchivePanel(){
    const panel = document.getElementById('bkcArchivePanel');
    panel.className = 'bkc-home-panel' + (state.showArchivePanel ? ' show' : '');
    panel.innerHTML = '';
    if (!state.showArchivePanel) return;

    const closeRow = document.createElement('div');
    closeRow.className = 'bkc-panel-close-row';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'bkc-panel-close';
    closeBtn.textContent = '✕';
    closeBtn.onclick = () => { state.showArchivePanel = false; renderArchivePanel(); };
    closeRow.appendChild(closeBtn);
    panel.appendChild(closeRow);

    const title = document.createElement('p');
    const unitLbl = (UNITS.find(u=>u.id===state.unit)||{}).label || state.unit;
    const unitLblTranslated = state.language === 'es' ? UI_ES.unitLabel(unitLbl) : unitLbl;
    title.innerHTML = `<b>${uiText('archiveTitle', unitLblTranslated) || 'Archived turnovers — ' + unitLbl}</b>`;
    panel.appendChild(title);

    if (!state.archiveList.length) {
      const empty = document.createElement('p');
      empty.textContent = uiText('archiveEmpty') || 'No archived records yet for this unit/type.';
      panel.appendChild(empty);
      return;
    }

    state.archiveList.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'bkc-archive-entry';
      const when = new Date(entry.archivedAt).toLocaleString(state.language === 'es' ? 'es' : 'en-US');
      row.innerHTML = `<b>${when}</b><br>${entry.cleanerName} — ${entry.doneItems}/${entry.totalItems} · 💬 ${entry.commentCount} · 🐛 ${entry.pestCount}`;
      const detail = document.createElement('div');
      detail.className = 'bkc-archive-detail';
      detail.style.display = 'none';
      row.onclick = async () => {
        if (detail.style.display === 'none') {
          if (!detail._loaded) {
            try{
              const full = await loadArchiveDetail(entry.id);
              detail.innerHTML = '';

              const textPart = document.createElement('div');
              let text = `${uiText('notesForSteve') || 'Notes'}: ${full.generalNotes || '—'}\n\n`;
              if (full.commentedItems.length) {
                text += (state.language === 'es' ? 'Notas por artículo:\n' : 'Item notes:\n');
                full.commentedItems.forEach(c => { text += `• ${c.section}: ${c.item} — "${c.comment}"\n`; });
                text += '\n';
              }
              if (full.pestReports.length) {
                text += (state.language === 'es' ? 'Reportes de plagas:\n' : 'Pest reports:\n');
                full.pestReports.forEach(p => { text += `• ${p.sectionKey}${p.note ? ' — "' + p.note + '"' : ''}\n`; });
              }
              textPart.textContent = text.trim();
              detail.appendChild(textPart);

              const photoEntries = Object.entries(full.photos || {});
              if (photoEntries.length) {
                const photoGrid = document.createElement('div');
                photoGrid.className = 'bkc-archive-photo-grid';
                photoEntries.forEach(([key, url]) => {
                  const link = document.createElement('a');
                  link.href = url;
                  link.target = '_blank';
                  link.rel = 'noopener';
                  const img = document.createElement('img');
                  img.src = url;
                  img.loading = 'lazy';
                  img.className = 'bkc-archive-photo-thumb';
                  link.appendChild(img);
                  photoGrid.appendChild(link);
                });
                detail.appendChild(photoGrid);
              }
            } catch(e){
              console.error('archive detail load failed', e);
              detail.textContent = uiText('archiveLoadError') || 'Could not load full record.';
            }
            detail._loaded = true;
          }
          detail.style.display = 'block';
        } else {
          detail.style.display = 'none';
        }
      };
      row.appendChild(detail);
      panel.appendChild(row);
    });
  }

  function renderHomePanel(){
    const panel = document.getElementById('bkcHomePanel');
    panel.className = 'bkc-home-panel' + (state.showAddToHome ? ' show' : '');
    panel.innerHTML = '';
    if (!state.showAddToHome) return;

    const closeRow = document.createElement('div');
    closeRow.className = 'bkc-panel-close-row';
    const closeBtn = document.createElement('button');
    closeBtn.className = 'bkc-panel-close';
    closeBtn.textContent = '✕';
    closeBtn.onclick = () => { state.showAddToHome = false; renderHomePanel(); };
    closeRow.appendChild(closeBtn);
    panel.appendChild(closeRow);

    const content = document.createElement('div');
    if (state.language === 'es') {
      content.innerHTML = `
        <p><b>${UI_ES.addToHome}</b></p>
        <p>📱 iPhone/iPad: ${UI_ES.addToHomeIOS}</p>
        <p>🤖 Android: ${UI_ES.addToHomeAndroid}</p>
      `;
    } else {
      content.innerHTML = `
        <p><b>Add This App to Your Home Screen</b></p>
        <p>📱 iPhone/iPad (Safari): tap the Share button (square with an arrow), scroll down, then tap "Add to Home Screen".</p>
        <p>🤖 Android (Chrome): tap the ⋮ menu in the top right, then tap "Add to Home screen" or "Install app".</p>
      `;
    }
    panel.appendChild(content);
  }

  let hasInitializedOnce = false;
  let realtimeChannel = null;

  function isTypingSomewhere(){
    const el = document.activeElement;
    return el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'checkbox'));
  }

  // True live sync: subscribes to Postgres changes on this unit+type's row so everyone
  // looking at the same checklist (cleaner, Steve, his wife) sees updates within ~1 second,
  // no manual refresh or polling delay. Skips applying an incoming update if someone's
  // actively typing here, so it never clobbers an in-progress note.
  function subscribeToLiveUpdates(){
    if (realtimeChannel) {
      sb.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }
    realtimeChannel = sb
      .channel(`checklist-${state.unit}-${state.type}`)
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'checklist_sessions',
        filter: `unit=eq.${state.unit}`,
      }, (payload) => {
        const row = payload.new;
        if (!row || row.type !== state.type) return; // filter only covers one column; double-check the other
        if (state.showPasscodeModal || isTypingSomewhere()) return;
        loadState().then(render);
      })
      .subscribe();
  }

  async function init(){
    document.getElementById('bkcBody').innerHTML = '<div class="bkc-loading">Loading checklist…</div>';
    loadLanguage();
    await loadState();
    if (!hasInitializedOnce) {
      // Only on the very first load of this session — not on every unit/type tab switch,
      // which also calls init() to reload that combo's saved state.
      state.showHelp = true;
      state.showAddToHome = true;
      hasInitializedOnce = true;
    }
    subscribeToLiveUpdates(); // re-subscribes with the current unit/type filter every init() call
    render();
    renderHomePanel();
    renderHelpPanel();
  }

  // ---- Cleaner login -------------------------------------------------------
  // The Edge Function is the only thing that can check a PIN (see migration —
  // verify_cleaner_pin() isn't callable by the public anon key). This function
  // IS the auth step, so it doesn't need/have a Supabase session of its own.
  const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/verify-cleaner-pin`;

  async function verifyCleanerLogin(name, pin){
    const resp = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_PUBLISHABLE_KEY,
        'Authorization': `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
      },
      body: JSON.stringify({ name, pin }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return resp.json(); // { ok: boolean, name?: string }
  }

  function showLoginScreen(show){
    document.getElementById('bkcLoginOverlay').className = 'bkc-login-overlay' + (show ? ' show' : '');
  }

  function setLoginError(msg){
    document.getElementById('bkcLoginErrorMsg').textContent = msg || '';
  }

  function setLoginLoading(loading){
    const btn = document.getElementById('bkcLoginSubmit');
    btn.disabled = loading;
    btn.textContent = loading ? '…' : (uiText('signIn') || 'Sign In');
  }

  async function handleLoginSubmit(){
    const name = document.getElementById('bkcLoginName').value.trim();
    const pin = document.getElementById('bkcLoginPin').value.trim();
    if (!name || !pin) {
      setLoginError(uiText('loginMissingFields') || 'Enter your name and PIN.');
      return;
    }
    setLoginLoading(true);
    setLoginError('');
    try {
      const result = await verifyCleanerLogin(name, pin);
      if (result.ok) {
        localStorage.setItem('bkc-cleaner-auth', JSON.stringify({ name, pin }));
        state.cleanerName = result.name;
        showLoginScreen(false);
        await init();
      } else {
        setLoginError(uiText('loginRejected') || 'Name or PIN not recognized. Ask Steve for access.');
      }
    } catch (e) {
      console.error('login failed', e);
      setLoginError(uiText('loginNetworkError') || 'Could not reach the server. Check your connection and try again.');
    }
    setLoginLoading(false);
  }

  document.getElementById('bkcLoginSubmit').addEventListener('click', handleLoginSubmit);
  document.getElementById('bkcLoginPin').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLoginSubmit();
  });
  document.getElementById('bkcLoginName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('bkcLoginPin').focus();
  });

  async function bootApp(){
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem('bkc-cleaner-auth') || 'null'); } catch(e) { stored = null; }

    if (stored && stored.name && stored.pin) {
      let result = null;
      let networkFailed = false;
      try {
        result = await verifyCleanerLogin(stored.name, stored.pin);
      } catch (e) {
        networkFailed = true;
        console.warn('login re-verification network failure, proceeding with cached identity', e);
      }

      if (networkFailed) {
        // Genuine connectivity problem, not a rejection — don't lock someone out over
        // spotty wifi. Proceed with the cached identity; re-verification just happens
        // again next load. This is the ONLY path that fails open, and it's isolated
        // from the rejection path below on purpose.
        state.cleanerName = stored.name;
        showLoginScreen(false);
        await init();
        return;
      }

      if (result && result.ok) {
        state.cleanerName = result.name;
        showLoginScreen(false);
        await init();
        return;
      }

      // Explicitly rejected by the server (wrong PIN, or account deactivated — this IS
      // the revocation moment for a fired cleaner). This branch must never grant access,
      // so clearing storage gets its own try/catch: even if it fails, we still fall
      // through to the login screen below rather than letting a clearing error be
      // mistaken for a network failure and accidentally admit someone.
      try { localStorage.removeItem('bkc-cleaner-auth'); } catch(e) { /* ignore */ }
    }
    showLoginScreen(true);
    document.getElementById('bkcLoginTitle').textContent = uiText('loginTitle') || 'Sign in to continue';
    setTimeout(() => document.getElementById('bkcLoginName').focus(), 0);
  }

  bootApp();
})();
</script>
</body>
</html>
